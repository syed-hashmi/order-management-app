<mat-card class="product-form-card">
    <mat-card-header>
        <mat-card-title>{{ isEditMode ? 'Edit Product' : 'Add Product' }}</mat-card-title>
    </mat-card-header>
    <br/>
    <mat-card-content>
        <form [formGroup]="productForm">

            <div class="form-grid">

                <mat-form-field appearance="outline">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" placeholder="Enter name" maxlength="50"/>

                    <mat-error *ngIf="productForm.controls['name'].hasError('required')">
                        Name is required.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>SKU</mat-label>
                    <input matInput formControlName="sku" placeholder="Enter SKU" />

                    <mat-error *ngIf="productForm.controls['sku'].hasError('required')">
                        SKU is required.
                    </mat-error>


                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Price</mat-label>
                    <input matInput  type="number" formControlName="price" />
                    <mat-error *ngIf="productForm.controls['price'].hasError('required')">
                        Price is required.
                    </mat-error>

                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Stock Quantity</mat-label>
                    <input matInput  type="number" formControlName="stockQuantity" />
                    <mat-error *ngIf="productForm.controls['stockQuantity'].hasError('required')">
                        Quantity is required.
                    </mat-error>

                </mat-form-field>

                <div class="status-container">
                    <label>Status</label>
                    <mat-slide-toggle formControlName="isActive">
                        Active
                    </mat-slide-toggle>
                </div> 
               
            </div>
            <div class="button-container">
                <button mat-stroked-button color="primary" type="button" (click)=cancel()>
                    Cancel
                </button>
                @if(isEditMode){
                <button mat-flat-button color="primary" (click)=updateProduct()>
                    Update Product
                </button>
                }@else{
                <button mat-flat-button color="primary" (click)=createProduct()>
                    Save Product
                </button>
                }
            </div>
        </form>
    </mat-card-content>
</mat-card>
