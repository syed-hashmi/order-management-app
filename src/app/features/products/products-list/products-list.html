<h2>Products</h2>
<div class="toolbar">
    <mat-form-field appearance="outline">
        <mat-label>Search Product</mat-label>
        <input matInput placeholder="Search by name" [formControl]="searchControl">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button color="primary" class="add-btn" routerLink="/product/new">
        <mat-icon>add</mat-icon>
        Add Product
    </button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
            Name
        </th>
        <td mat-cell *matCellDef="let product">
            {{ product.name }}
        </td>
    </ng-container>

    <ng-container matColumnDef="sku">
        <th mat-header-cell *matHeaderCellDef>
            SKU
        </th>
        <td mat-cell *matCellDef="let product">
            {{ product.sku }}
        </td>
    </ng-container>

    <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>
            Price
        </th>
        <td mat-cell *matCellDef="let product">
            {{ product.price }}
        </td>
    </ng-container>

    <ng-container matColumnDef="stockQuantity">
        <th mat-header-cell *matHeaderCellDef>
            Stock Quantity
        </th>
        <td mat-cell *matCellDef="let product">
            {{ product.stockQuantity }}
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
            Actions
        </th>
        <td mat-cell *matCellDef="let product">
            <button [routerLink]="['/product',product.id, 'view']" mat-icon-button color="primary">
                <mat-icon>visibility</mat-icon>
            </button>
            <button [routerLink]="['/product',product.id, 'edit']" mat-icon-button color="accent">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="deleteProduct(product.id)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [length]="totalRecords" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[5,10,20]"
    (page)="pageChanged($event)" showFirstLastButtons>
</mat-paginator>
