<h2 *ngIf="!showRecent">Orders</h2>
<div class="toolbar" *ngIf="!showRecent">
    <mat-form-field appearance="outline">
        <mat-label>Search Order</mat-label>
        <input matInput placeholder="Order No" [formControl]="searchControl">
        <mat-icon matSuffix>
            search
        </mat-icon>
    </mat-form-field>
    <button mat-flat-button color="primary" class="add-btn" routerLink="/order/new">
        <mat-icon>
            add
        </mat-icon>
        New Order
    </button>

</div>

<table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
            Order #
        </th>
        <td mat-cell *matCellDef="let order">
            {{order.id}}
        </td>
    </ng-container>

    <ng-container matColumnDef="customerName">
        <th mat-header-cell *matHeaderCellDef>
            Customer
        </th>
        <td mat-cell *matCellDef="let order">
            {{order.customerName}}
        </td>
    </ng-container>

    <ng-container matColumnDef="orderDate">
        <th mat-header-cell *matHeaderCellDef>
            Order Date
        </th>
        <td mat-cell *matCellDef="let order">
            {{order.orderDate}}
        </td>
    </ng-container>

    <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef>
            No Of Items
        </th>
        <td mat-cell *matCellDef="let order">
            {{order.items?.length}}
        </td>
    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>
            Status
        </th>
        <td mat-cell *matCellDef="let order">
            {{order.status}}
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
        </th>
        <td mat-cell *matCellDef="let order">
            <button mat-icon-button color="primary" (click)="viewDetails(order?.id)">
                <mat-icon>
                    visibility
                </mat-icon>
            </button>
             <button mat-icon-button color="accent" (click)="deleteOrder(order?.id)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns">
    </tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns">
    </tr>
    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No orders found.
        </td>
    </tr>

</table>

<mat-paginator *ngIf="!showRecent" [length]="totalRecords" [pageSize]="pageSize" [pageIndex]="pageIndex"
    [pageSizeOptions]="[5,10,20]" (page)="pageChanged($event)" showFirstLastButtons>
</mat-paginator>
