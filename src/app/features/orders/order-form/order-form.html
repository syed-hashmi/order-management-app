<mat-card class="customer-form-card">
    <mat-card-header>
        <mat-card-title>Create Order</mat-card-title>
    </mat-card-header>
    <br />
    <mat-card-content>
        <form [formGroup]="orderForm">
            <div class="form-grid">
                <mat-form-field appearance="outline">
                    <mat-label>Customer</mat-label>
                    <mat-select formControlName="customer">
                        <mat-option *ngFor="let customer of customers" [value]="customer">
                            {{customer.fullName}}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="orderForm.get('customer')?.hasError('required')">
                        Customer is required.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">

                    <mat-label>Status</mat-label>

                    <mat-select formControlName="status">
                        <mat-option value="Pending">
                            Pending
                        </mat-option>
                        <mat-option value="Completed">
                            Completed
                        </mat-option>
                    </mat-select>

                </mat-form-field>
            </div>
            <h3>Order Items</h3>
            <div formArrayName="items">

                <div class="item-row" *ngFor="let item of items.controls; let i=index" [formGroupName]="i">
                    <mat-form-field appearance="outline">
                        <mat-label>Product</mat-label>
                        <mat-select formControlName="product" (selectionChange)="productChanged(i)">
                            <mat-option *ngFor="let product of products" [value]="product">
                                {{product.name}}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="items.at(i).get('product')?.hasError('required')">
                            Product is required.
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Unit Price</mat-label>
                        <input matInput formControlName="unitPrice" readonly>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Quantity</mat-label>
                        <input matInput type="number" formControlName="quantity" min="1" max="50">

                        <mat-error *ngIf="items.at(i).get('quantity')?.hasError('required')">
                            Quantity is required.
                        </mat-error>

                        <mat-error *ngIf="items.at(i).get('quantity')?.hasError('min')">
                            Min quantity is 1.
                        </mat-error>

                        <mat-error *ngIf="items.at(i).get('quantity')?.hasError('max')">
                            Max quantity is 50.
                        </mat-error>
                    </mat-form-field>
                    <button mat-icon-button color="warn" type="button" (click)="removeItem(i)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>

            </div>
            <div class="display-total">
                <button mat-stroked-button color="primary" type="button" (click)="addItem()">
                    <mat-icon>add</mat-icon>
                    Add Item
                </button>

                <div class="order-total">
                    <span>Total Amount </span>
                    <strong>AED {{ totalAmount | number:'1.2-2' }}</strong>
                </div>
            </div>


            <div class="button-container">
                <button mat-stroked-button color="primary" type="button" (click)="cancel()">
                    Cancel
                </button>
                <button mat-flat-button color="primary" type="submit" (click)="createOrder()">
                    Create Order
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
