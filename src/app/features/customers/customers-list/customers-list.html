<h2>Customers</h2>
<div class="toolbar">
    <mat-form-field appearance="outline">
        <mat-label>Search Customer</mat-label>
        <input matInput placeholder="Search by name" [formControl]="searchControl">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button color="primary" class="add-btn" routerLink="/customer/new">
        <mat-icon>add</mat-icon>
        Add Customer
    </button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>
            Full Name
        </th>
        <!-- #{{customer.id}} -->
        <td mat-cell *matCellDef="let customer">
            {{ customer.fullName }}
        </td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>
            Email
        </th>
        <td mat-cell *matCellDef="let customer">
            {{ customer.email }}
        </td>
    </ng-container>

    <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef>
            Created Date
        </th>
        <td mat-cell *matCellDef="let customer">
            {{ customer.createdDate }}
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
            Actions
        </th>
        <td mat-cell *matCellDef="let customer">
            <button [routerLink]="['/customer',customer.id, 'view']" mat-icon-button color="primary">
                <mat-icon>visibility</mat-icon>
            </button>
            <button [routerLink]="['/customer',customer.id, 'edit']" mat-icon-button color="accent">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="deleteCustomer(customer.id)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No customers found.
        </td>
    </tr>
</table>

<mat-paginator [length]="totalRecords" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[5,10,20]"
    (page)="pageChanged($event)" showFirstLastButtons>
</mat-paginator>
