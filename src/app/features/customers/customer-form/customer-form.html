<mat-card class="customer-form-card">
    <mat-card-header>
        <mat-card-title>{{ isEditMode ? 'Edit Customer' : 'Add Customer' }}</mat-card-title>
    </mat-card-header>
    <br/>
    <mat-card-content>
        <form [formGroup]="customerForm">

            <div class="form-grid">

                <mat-form-field appearance="outline">
                    <mat-label>Full Name</mat-label>
                    <input matInput formControlName="fullName" placeholder="Enter full name" />

                    <mat-error *ngIf="customerForm.controls['fullName'].hasError('required')">
                        Full Name is required.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="Enter email" />

                    <mat-error *ngIf="customerForm.controls['email'].hasError('required')">
                        Email is required.
                    </mat-error>

                    <mat-error *ngIf="customerForm.controls['email'].hasError('email')">
                        Invalid email address.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Phone Number</mat-label>
                    <input matInput formControlName="phoneNumber" placeholder="+971 50 123 4567" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Date of Birth</mat-label>

                    <input matInput [matDatepicker]="picker" formControlName="dateOfBirth">

                    <mat-datepicker-toggle matIconSuffix [for]="picker">
                    </mat-datepicker-toggle>

                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Gender</mat-label>

                    <mat-select formControlName="gender">
                        <mat-option value="Male">Male</mat-option>
                        <mat-option value="Female">Female</mat-option>
                        <mat-option value="Other">Other</mat-option>
                    </mat-select>
                </mat-form-field>

                <div class="status-container">

                    <label>Status</label>

                    <mat-slide-toggle formControlName="isActive">
                        Active
                    </mat-slide-toggle>

                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Address</mat-label>
                    <textarea matInput rows="4" formControlName="address" placeholder="Enter address">
                    </textarea>
                </mat-form-field>
            </div>
            <div class="button-container">
                <button mat-stroked-button color="primary" type="button" (click)=cancel()>
                    Cancel
                </button>
                @if(isEditMode){
                <button mat-flat-button color="primary" (click)=updateCustomer()>
                    Update Customer
                </button>
                }@else{
                <button mat-flat-button color="primary" (click)=createCustomer()>
                    Save Customer
                </button>
                }
            </div>
        </form>
    </mat-card-content>
</mat-card>
